<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonbase Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF0FF;--panel:#FFFFFF;--panel2:#E4E7FA;--text:#14183A;--muted:#4A5088;--line:#C9CDEE;
  --power:#D98A00;--o2:#0E9F94;--food:#4C9A1F;--rad:#D12A68;--data:#2A7FD6;--sun:#FFB627;
  --btn:#14183A;--btnText:#FFFFFF;--sky-day:#9CC8FF;--sky-night:#14183A;--ground:#B9B4AB;--ground2:#9A958C;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1331;--panel:#1B2050;--panel2:#262C66;--text:#F4F1FF;--muted:#AEB5E8;--line:#383F82;
  --power:#FFB627;--o2:#2EC4B6;--food:#7BC950;--rad:#FF5C93;--data:#6CB8FF;
  --btn:#FFB627;--btnText:#14183A;--sky-night:#0A0D26;--ground:#8B867E;--ground2:#6F6B64;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1331;--panel:#1B2050;--panel2:#262C66;--text:#F4F1FF;--muted:#AEB5E8;--line:#383F82;
  --power:#FFB627;--o2:#2EC4B6;--food:#7BC950;--rad:#FF5C93;--data:#6CB8FF;
  --btn:#FFB627;--btnText:#14183A;--sky-night:#0A0D26;--ground:#8B867E;--ground2:#6F6B64;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:auto;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Atkinson Hyperlegible',ui-rounded,'Trebuchet MS',system-ui,sans-serif;font-size:17px;line-height:1.45}
h1,h2,h3{font-family:'Fredoka',ui-rounded,'Trebuchet MS',sans-serif;font-weight:700;line-height:1.1;margin:0}
h1{font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.01em}
h2{font-size:1.5rem}h3{font-size:1.15rem}
p{margin:.4em 0}
small,.small{font-size:.88rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.btn{background:var(--btn);color:var(--btnText);border:0;border-radius:14px;padding:.8em 1.3em;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.1rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.big{font-size:1.3rem;padding:.9em 1.6em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px}
.chip{background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:.5em .9em;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--sun);background:var(--panel)}
.chip.sel{border-color:var(--sun)}

/* setup */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;padding:8px 0 18px}
.hero p.lead{font-size:1.2rem;max-width:34ch}
.hero svg{width:100%;height:auto;border-radius:22px;border:2px solid var(--line)}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.names input,.codebox input{width:100%;font:inherit;padding:.6em .8em;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--text)}
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.site{text-align:left;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px}
.site[aria-pressed="true"]{border-color:var(--sun)}
.site .ic{font-size:2rem}
.tag{display:inline-block;border-radius:8px;padding:.1em .6em;font-size:.85rem;font-weight:700;background:var(--panel2)}
section.block{margin-top:22px}

/* design */
.parts{display:grid;gap:10px;margin-top:10px}
.part{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.part .ic{font-size:1.9rem}
.step{display:flex;align-items:center;gap:8px}
.step button{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid var(--line);background:var(--panel2);font-weight:700;font-size:1.3rem;line-height:1}
.step b{min-width:1.6em;text-align:center;font-size:1.2rem}
.budget{height:16px;border-radius:99px;background:var(--panel2);overflow:hidden}
.budget i{display:block;height:100%;background:var(--sun)}
.budget.over i{background:var(--rad)}

/* game */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.daybadge{font-family:'Fredoka',sans-serif;font-size:1.5rem;font-weight:700}
.pill{border-radius:99px;padding:.25em .8em;font-weight:700;background:var(--panel2);font-size:.95rem}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px;align-items:start}
.scene{width:100%;height:auto;display:block;border-radius:16px}
.meters{display:grid;gap:10px;margin-top:12px}
.meter .ml{display:flex;justify-content:space-between;font-weight:700}
.track{position:relative;height:16px;border-radius:99px;background:var(--panel2);overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .5s}
.track .tick{position:absolute;top:-2px;bottom:-2px;width:4px;background:var(--text);border-radius:2px;opacity:.85}
.crew{display:grid;gap:12px}
.astro h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:.9rem;margin-top:4px}
.mini .track{height:10px}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.task{text-align:left;background:var(--panel2);border:3px solid transparent;border-radius:12px;padding:8px 10px}
.task[aria-pressed="true"]{border-color:var(--sun);background:var(--panel)}
.task:disabled{opacity:.4;cursor:not-allowed}
.task b{display:block}
.task small{display:block;line-height:1.2}
.forecast{font-size:.95rem}
.log{margin:0;padding-left:1.1em;font-size:.95rem;max-height:210px;overflow:auto}
.log li{margin:.15em 0}
.overlay{position:fixed;inset:0;background:rgba(5,7,25,.72);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.modal{max-width:560px;width:100%;background:var(--panel);border:3px solid var(--sun);border-radius:22px;padding:20px}
.modal .big{font-size:2.6rem}
.opt{display:block;width:100%;text-align:left;margin-top:10px;background:var(--panel2);border:3px solid var(--line);border-radius:14px;padding:12px 14px}
.opt b{font-family:'Fredoka',sans-serif;font-size:1.1rem}
.opt:hover{border-color:var(--sun)}
.advice{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border-left:6px solid var(--data)}
.lesson{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--panel2);border-left:6px solid var(--food)}

/* report */
.stars{font-size:3rem;letter-spacing:.1em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel2);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:1.6rem}
.chart{width:100%;height:auto}
.why li{margin:.5em 0}
table{border-collapse:collapse;width:100%}
td,th{padding:.35em .5em;text-align:left;border-bottom:1px solid var(--line)}
.codebox{display:flex;gap:8px;flex-wrap:wrap}
.codebox input{flex:1;min-width:200px;font-family:ui-monospace,monospace;font-size:.85rem}
a{color:var(--data)}
.err{color:var(--rad);font-weight:700}
@media (max-width:860px){.hero,.game{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pulse{50%{transform:scale(1.04)}}
.pulse{animation:pulse 1.4s ease-in-out 3}

/* polish */
body{background:var(--bg) var(--stars,none)}
:root{--stars:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stars:radial-gradient(1.2px 1.2px at 30px 40px,#ffffffaa,transparent),radial-gradient(1px 1px at 130px 90px,#ffffff77,transparent),radial-gradient(1.5px 1.5px at 210px 200px,#ffffffaa,transparent),radial-gradient(1px 1px at 80px 230px,#ffffff66,transparent);}}
:root[data-theme="dark"]{--stars:radial-gradient(1.2px 1.2px at 30px 40px,#ffffffaa,transparent),radial-gradient(1px 1px at 130px 90px,#ffffff77,transparent),radial-gradient(1.5px 1.5px at 210px 200px,#ffffffaa,transparent),radial-gradient(1px 1px at 80px 230px,#ffffff66,transparent)}
body{background-size:auto,260px 260px}
.scenecv{width:100%;height:auto;aspect-ratio:5/3;display:block;border-radius:14px;touch-action:manipulation;background:#0a0c22}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.small-chip{font-size:.95rem;padding:.4em .8em}
.small-chip:hover{border-color:var(--sun)}
.sceneinfo{margin:10px 2px 0;min-height:3.2em;font-size:.98rem}
.task{transition:transform .12s,border-color .12s}
.task:hover:not(:disabled){transform:translateY(-2px)}
.card{box-shadow:0 6px 0 -2px rgba(0,0,0,.12)}
.site:hover{transform:translateY(-3px)}
.site{transition:transform .15s}
small.dn{color:var(--rad)}small.up{color:var(--food)}
.btn:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:not(:disabled):active{transform:translateY(1px)}

/* interactions */
.btn,.task,.chip,.opt,.site,.sndbtn{position:relative}
.btn:not(:disabled):hover,.task:not(:disabled):hover,.chip:hover,.opt:hover,.sndbtn:hover{background-image:radial-gradient(circle 90px at var(--mx,50%) var(--my,50%),rgba(255,255,255,.30),transparent 70%)}
.btn.ghost:not(:disabled):hover,.task:not(:disabled):hover,.chip:hover,.opt:hover{background-image:radial-gradient(circle 90px at var(--mx,50%) var(--my,50%),rgba(255,182,39,.28),transparent 70%)}
.task:active:not(:disabled),.chip:active,.opt:active,.site:active,.step button:active{transform:scale(.96)}
.site{transform:perspective(700px) rotateX(var(--ty,0deg)) rotateY(var(--tx,0deg))}
.site:hover{transform:perspective(700px) rotateX(var(--ty,0deg)) rotateY(var(--tx,0deg)) translateY(-3px)}
.step button:hover:not(:disabled){border-color:var(--sun);background:var(--panel)}
.step button:disabled{opacity:.35;cursor:not-allowed}
.task kbd{position:absolute;top:6px;right:8px;font:700 .8rem 'Fredoka',sans-serif;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:0 .4em;color:var(--muted)}
.task[aria-pressed="true"]{animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.astro{cursor:default;transition:border-color .15s,transform .15s}
.astro.active{border-color:var(--sun)}
.astro:hover{transform:translateY(-1px)}
.meter{padding:4px 6px;border-radius:12px;transition:background .15s}
.meter:hover{background:var(--panel2)}
.part{transition:transform .15s,border-color .15s}
.part:hover{transform:translateX(3px);border-color:var(--sun)}
#tip{position:fixed;left:0;top:0;max-width:260px;background:#0a0c28;color:#fff;border:2px solid var(--sun);border-radius:12px;padding:.5em .8em;font-size:.92rem;line-height:1.3;z-index:70;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
.sndbtn{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:55;width:2.8rem;height:2.8rem;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:1.3rem;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.sndbtn[aria-pressed="true"]{border-color:var(--sun)}
.chip.small-chip:active{transform:scale(.94)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===== MOONBASE MISSION CONTROL — ENGINE (no DOM; testable in Node) ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const MISSION_DAYS=30;

/* Archived real flares (class values recalled from NASA/NOAA records — verify in DONKI before presenting). */
const FLARE_ARCHIVE=[
  {date:'2017-09-06',cls:'X9.3'},
  {date:'2024-05-10',cls:'X3.9'},
  {date:'2024-05-11',cls:'X5.8'},
  {date:'2024-05-14',cls:'X8.7'},
  {date:'2024-10-03',cls:'X9.0'}
];

const SITES={
  pole:{id:'pole',name:'Moon: South Pole ridge',icon:'🌕',level:'Medium',
    blurb:'Artemis is looking near here. The Sun shines most days, but shadows creep in.',
    sun:d=>((d-1)%8)<6?1:0, sunF:1, baseLoad:8, perCrew:2, darkLoad:4, dose:1.4, flareF:1,
    delay:'about 1.3 seconds each way', tx:24, unit:'day'},
  equator:{id:'equator',name:'Moon: Equator',icon:'🌗',level:'Hard',
    blurb:'Two weeks of sunshine, then two weeks of freezing darkness.',
    sun:d=>(d<=14||d>=30)?1:0, sunF:1, baseLoad:8, perCrew:2, darkLoad:5, dose:1.4, flareF:1,
    delay:'about 1.3 seconds each way', tx:24, unit:'day'},
  mars:{id:'mars',name:'Mars: Jezero-style plain',icon:'🔴',level:'Hard',
    blurb:'Thin air, dusty skies, and messages that take minutes to arrive.',
    sun:d=>1, sunF:0.45, baseLoad:6, perCrew:1.5, darkLoad:0, dose:0.67, flareF:0.6,
    delay:'3 to 22 minutes each way', tx:14, unit:'sol'}
};
const DIFFS={
  easy:{name:'Explorer',use:0.8,evProb:0.22,flares:3,budget:150,goal:70,hit:0.6},
  normal:{name:'Commander',use:1,evProb:0.32,flares:4,budget:150,goal:110,hit:0.7},
  hard:{name:'Flight Director',use:1.15,evProb:0.42,flares:4,budget:120,goal:140,hit:0.8}
};
const MASS=14;
const PARTS=[
  {k:'p',icon:'☀️',name:'Solar panels',cost:1,max:8,def:4,why:'Each panel makes about 9 power a day in full Sun.'},
  {k:'b',icon:'🔋',name:'Batteries',cost:1,max:5,def:2,why:'Save power for shadows and night. Each holds 30.'},
  {k:'n',icon:'☢️',name:'Nuclear battery',cost:2,max:3,def:0,why:'Makes 7 power every day, even in the dark. Heavy! Real rovers use these.'},
  {k:'k',icon:'🛡️',name:'Shield kit',cost:1,max:4,def:1,why:'Thicker walls block more radiation from day one.'},
  {k:'g',icon:'🌱',name:'Garden beds',cost:1,max:3,def:1,why:'Each bed adds 2 food every time you tend the garden.'},
  {k:'i',icon:'🔬',name:'Science tools',cost:1,max:3,def:1,why:'Better tools get more data from every experiment.'},
  {k:'d',icon:'📡',name:'Radio dish',cost:1,max:3,def:1,why:'A bigger dish sends more data home in one go.'}
];
const defaultDesign=()=>Object.fromEntries(PARTS.map(p=>[p.k,p.def]));
const designCost=d=>PARTS.reduce((t,p)=>t+p.cost*(d[p.k]||0),0);

const TASKS={
  o2:{icon:'💨',name:'Make oxygen',verb:'make oxygen',pw:s=>6,
      txt:s=>`⚡−6 → 💨+10`},
  farm:{icon:'🌱',name:'Tend garden',verb:'tend the garden',pw:s=>3,
      txt:s=>`⚡−3 → 🥦+${7+2*s.design.g}`},
  shield:{icon:'🛡️',name:'Pile on shielding',verb:'build shielding',pw:s=>3+s.shield,outside:true,
      txt:s=>`⚡−${3+s.shield} → 🛡️+1 (outside, no shield)`},
  clean:{icon:'🧹',name:'Brush panels',verb:'brush the panels',pw:s=>0,outside:true,
      txt:s=>`free → panels back to 100% (outside)`},
  lab:{icon:'🔬',name:'Run experiment',verb:'run an experiment',pw:s=>6,
      txt:s=>`⚡−6 → 💾+${10+3*s.design.i}`},
  eva:{icon:'🧑‍🚀',name:'Moonwalk',verb:'explore outside',pw:s=>3,outside:true,
      txt:s=>`⚡−3 💨−8 → 💾+${20+4*s.design.i}, 3x radiation`},
  tx:{icon:'📡',name:'Send data home',verb:'send data',pw:s=>4,
      txt:s=>`⚡−4 → send ${SITES[s.site].tx+6*s.design.d} 💾 to Earth`},
  rest:{icon:'😴',name:'Rest & check-up',verb:'rest',pw:s=>0,
      txt:s=>`free → ❤️+15`}
};
const TASK_ORDER=['o2','farm','shield','clean','lab','eva','tx','rest'];

function flareDose(cls){const L=cls[0],m=parseFloat(cls.slice(1))||1;return L==='X'?25+7*m:L==='M'?8+2*m:4}
const shieldFactor=s=>Math.max(0.3,1-0.07*s.shield);

/* ---------- events ---------- */
const EVENTS=[
 {id:'leak',sites:['pole','equator'],icon:'☄️',title:'A space rock hit the roof!',
  text:'A tiny meteoroid punched a hole in the airlock wall. Air is hissing out.',
  options:[
   {label:'Patch it now',desc:'Uses 6 power for the repair robot',fx:s=>{s.power=Math.max(0,s.power-6);return 'The robot patched the hole fast. Hardly any air escaped.'}},
   {label:'Seal the door and wait',desc:'You will lose about 12 oxygen',fx:s=>{s.o2=Math.max(0,s.o2-12);return 'Air kept leaking until the door was sealed.'}}],
  best:()=>0,lesson:'The Moon has no air at all, so even small leaks matter. Real habitats have many sealed rooms.'},
 {id:'dust',sites:['pole','equator','mars'],icon:'🌫️',title:'Dust on the solar panels',
  text:'Sticky dust has settled over the panels. They can’t soak up as much sunlight.',
  options:[
   {label:'Brush them with the robot arm',desc:'Uses 3 power',fx:s=>{s.power=Math.max(0,s.power-3);return 'The robot arm brushed the panels clean.'}},
   {label:'Leave it for now',desc:'Panels lose 25% of their power',fx:s=>{s.eff=Math.max(0.4,s.eff-0.25);return 'The panels are dustier. You get less power.'}}],
  best:()=>0,lesson:'Dust is a real problem. It ended the Opportunity rover’s mission on Mars when a huge storm blocked the Sun.'},
 {id:'storm',sites:['mars'],icon:'🌪️',title:'A Martian dust storm!',
  text:'The sky turns orange-brown. For 3 sols your solar panels will make only a third of their power.',
  options:[
   {label:'Turn off the garden lights',desc:'Saves power, but the garden pauses for 3 sols',fx:s=>{s.mods.storm=3;s.mods.ghOff=3;return 'Dark skies and dark garden. Be careful with your food.'}},
   {label:'Keep everything on',desc:'The battery has to carry the load',fx:s=>{s.mods.storm=3;return 'The battery is working hard through the storm.'}}],
  best:s=>s.power>60?1:0,lesson:'Mars dust storms can cover the whole planet and last for weeks. Missions plan for them with extra batteries or nuclear power.'},
 {id:'blight',sites:['pole','equator','mars'],icon:'🥀',title:'Sick plants in the garden',
  text:'Some leaves are turning brown. A mold is spreading.',
  options:[
   {label:'Remove the sick plants',desc:'You lose 10 food',fx:s=>{s.food=Math.max(0,s.food-10);return 'The mold is gone, but so is some food.'}},
   {label:'Treat with UV light',desc:'Uses 8 power, you lose 3 food',fx:s=>{s.power=Math.max(0,s.power-8);s.food=Math.max(0,s.food-3);return 'UV light saved most of the plants.'}}],
  best:s=>s.power>45?1:0,lesson:'On the space station, astronauts really grow lettuce and chili peppers. Keeping plants healthy takes careful work.'},
 {id:'rock',sites:['pole','equator','mars'],icon:'💎',title:'A rare rock! Quick, worth a look?',
  text:'The rover camera spotted a shiny rock nearby. Scientists on Earth are very excited.',
  options:[
   {label:'Send someone outside to grab it',desc:'Costs 10 oxygen and some radiation. Gives 25 data!',fx:s=>{s.o2=Math.max(0,s.o2-10);s.data=Math.min(DATA_CAP,s.data+25);const a=s.crew.slice().sort((x,y)=>x.dose-y.dose)[0];a.dose+=SITES[s.site].dose*3;return `${a.name} brought back a great sample. +25 data!`}},
   {label:'Mark it for later',desc:'Nothing changes today',fx:s=>'You marked the rock on the map. Maybe next time.'}],
  best:s=>s.o2>45?0:1,lesson:'Every moonwalk trades air and safety for science. Mission planners decide when a discovery is worth the cost.'},
 {id:'antenna',sites:['pole','equator','mars'],icon:'📻',title:'The antenna is stuck',
  text:'The dish won’t turn toward Earth. No data can be sent until it’s fixed.',
  options:[
   {label:'Fix it right away',desc:'Uses 5 power',fx:s=>{s.power=Math.max(0,s.power-5);return 'The dish points at Earth again.'}},
   {label:'Wait for it to unstick',desc:'No sending data today',fx:s=>{s.mods.txOff=1;return 'The dish should free itself by tomorrow.'}}],
  best:()=>0,lesson:'If the antenna fails, all the science stays stuck on the base computers. Data only counts once it is sent home.'}
];
const DATA_CAP=120;

/* ---------- game creation ---------- */
let RNG=Math.random;
function newGame(cfg){
  const D=DIFFS[cfg.diff], names=cfg.names.slice(0,4);
  if(names.length<2) names.push('Buddy');
  RNG=mulberry32(cfg.seed);
  const pool=(cfg.flares&&cfg.flares.length?cfg.flares:FLARE_ARCHIVE).slice();
  const picked=shuffle(pool,RNG).slice(0,D.flares);
  const baseDays=[5,11,18,24];
  const flareDays={};
  picked.forEach((f,i)=>{flareDays[clamp(baseDays[i]+Math.floor(RNG()*3)-1,2,MISSION_DAYS-1)]=f});
  const d=cfg.design;
  const s={
    site:cfg.site,diff:cfg.diff,seed:cfg.seed,design:Object.assign({},d),flares:picked,
    crew:names.map(n=>({name:n,health:100,dose:0,rested:false,outside:false})),
    day:1,power:(60+30*d.b)*0.8,powerMax:60+30*d.b,o2:100,food:80,
    data:0,sent:0,shield:d.k,eff:1,
    mods:{storm:0,ghOff:0,txOff:0},sheltered:false,flareHit:false,
    flareDays,today:null,replies:[],log:[],history:[],
    stats:{fizzles:0,brownouts:0,o2Short:0,foodShort:0,storageFull:0,shelters:0,flareDoseTaken:0,flareDoseDodged:0,evas:0,tasks:{},events:0,askedEarth:0},
    ended:null

  return s;
}

function startDay(s){
  const site=SITES[s.site],D=DIFFS[s.diff];
  s.sheltered=false;s.flareHit=false;
  s.today={flare:null,event:null,sun:site.sun(s.day)};
  if(s.flareDays[s.day]){
    s.today.flare=s.flareDays[s.day];
    s.flareHit=RNG()<D.hit;
  }else if(s.day>=2&&RNG()<D.evProb){
    const ok=EVENTS.filter(e=>e.sites.includes(s.site));
    s.today.event=ok[Math.floor(RNG()*ok.length)];
  }
}

function panelCount(s){return s.design.p+2*Math.max(0,s.crew.length-2)}
function solarToday(s){
  const site=SITES[s.site];
  return panelCount(s)*9*s.eff*site.sunF*s.today.sun*(s.mods.storm>0?0.3:1);
}
function loadToday(s){
  const site=SITES[s.site];
  return site.baseLoad+site.perCrew*s.crew.length+(s.today.sun?0:site.darkLoad);
}
function nukeToday(s){return s.design.n*7}
function taskAvailable(s,k){
  if(s.sheltered&&TASKS[k].outside)return false;
  if(k==='farm'&&s.mods.ghOff>0)return false;
  if(k==='tx'&&s.mods.txOff>0)return false;
  return true;
}

/* ---------- running one day ---------- */
function playDay(s,picks,preview){
  const site=SITES[s.site],D=DIFFS[s.diff],out=[],crew=s.crew,n=crew.length;
  crew.forEach(a=>{a.rested=false;a.outside=false});
  if(s.sheltered){s.power=Math.max(0,s.power-5);out.push('🏠 The storm shelter used 5 power for extra air and heat.');}
  picks.forEach((k,i)=>{
    const a=crew[i],T=TASKS[k];
    s.stats.tasks[k]=(s.stats.tasks[k]||0)+1;
    if(!taskAvailable(s,k)){out.push(`${a.name} couldn’t ${T.verb} today.`);s.stats.fizzles++;return}
    const cost=T.pw(s);
    if(s.power<cost){out.push(`${a.name} tried to ${T.verb}, but there wasn’t enough power.`);s.stats.fizzles++;return}
    if(k==='eva'&&s.o2<8){out.push(`${a.name} couldn’t go outside: not enough oxygen to spare.`);s.stats.fizzles++;return}
    s.power-=cost;
    if(T.outside)a.outside=true;
    switch(k){
      case 'o2':s.o2=Math.min(100,s.o2+10);out.push(`${a.name} made 10 oxygen.`);break;
      case 'farm':{const f=7+2*s.design.g;s.food=Math.min(100,s.food+f);out.push(`${a.name} grew ${f} food.`);break}
      case 'shield':s.shield=Math.min(10,s.shield+1);out.push(`${a.name} added shielding. Level ${s.shield}.`);break;
      case 'clean':s.eff=1;out.push(`${a.name} brushed the panels clean.`);break;
      case 'lab':{const g=10+3*s.design.i;s.data+=g;out.push(`${a.name} collected ${g} data.`);break}
      case 'eva':{const g=20+4*s.design.i;s.o2-=8;s.data+=g;s.stats.evas++;out.push(`${a.name} explored outside: ${g} data, used 8 oxygen.`);break}
      case 'tx':{const r=site.tx+6*s.design.d,m=Math.min(s.data,r);s.data-=m;s.sent+=m;out.push(m>0?`${a.name} sent ${m} data to Earth.`:`${a.name} had no data to send.`);break}
      case 'rest':a.rested=true;out.push(`${a.name} rested.`);break;
    }
  });
  if(s.data>DATA_CAP){s.data=DATA_CAP;s.stats.storageFull++;out.push('💾 Storage was full. Some data was lost!')}

  /* power */
  const gen=solarToday(s)+nukeToday(s),load=loadToday(s);
  s.power+=gen-load;
  let brown=false;
  if(s.power<0){s.power=0;brown=true;s.stats.brownouts++;out.push('⚠️ Brownout! The heaters shut off.')}
  s.power=Math.min(s.power,s.powerMax);

  /* air and food */
  s.o2-=3*n*D.use;let o2Out=false;
  if(s.o2<0){s.o2=0;o2Out=true;s.stats.o2Short++;out.push('⚠️ Out of oxygen!')}
  s.food-=2*n*D.use;let foodOut=false;
  if(s.food<0){s.food=0;foodOut=true;s.stats.foodShort++;out.push('⚠️ The food ran out!')}

  /* radiation */
  const base=site.dose,sf=shieldFactor(s);
  let flareDose=0;
  if(s.today.flare){
    flareDose=flareDose_(s.today.flare.cls)*site.flareF;
    if(s.flareHit)out.push(`☀️ The ${s.today.flare.cls} flare sent particles our way!`);
    else out.push(`☀️ The ${s.today.flare.cls} flare missed us this time.`);
  }
  crew.forEach(a=>{
    let d=a.outside?base*3:base*sf;
    if(s.flareHit&&flareDose>0){
      const exposed=a.outside?flareDose:flareDose*(s.sheltered?sf*0.4:sf);
      d+=exposed;s.stats.flareDoseTaken+=exposed;s.stats.flareDoseDodged+=flareDose-exposed;
    }
    a.dose+=d;
  });

  /* health */
  const budget=D.budget;
  crew.forEach(a=>{
    let dmg=0;
    if(o2Out)dmg+=30;if(foodOut)dmg+=12;if(brown)dmg+=8;if(a.dose>budget)dmg+=12;
    if(dmg>0)a.health-=dmg;else a.health+=a.rested?15:2;
    a.health=clamp(a.health,-1,100);
    if(a.dose>budget&&!a._warn){a._warn=true;out.push(`☢️ ${a.name} passed the radiation budget!`)}
  });

  /* timers and wear */
  s.eff=Math.max(0.4,s.eff-0.03);
  ['storm','ghOff','txOff'].forEach(k=>{if(s.mods[k]>0)s.mods[k]--});
  s.replies=s.replies.filter(r=>{if(r.day<=s.day){out.push('📬 '+r.text);return false}return true});

  const avgH=crew.reduce((t,a)=>t+Math.max(0,a.health),0)/n;
  s.history.push({d:s.day,power:Math.round(s.power),o2:Math.round(s.o2),food:Math.round(s.food),health:Math.round(avgH),dose:Math.round(Math.max(...crew.map(a=>a.dose))),sent:s.sent});
  s.log=out.concat(s.log).slice(0,40);

  const hurt=crew.find(a=>a.health<=0);
  if(hurt){s.ended={reason:'early',who:hurt.name}}
  else if(s.day>=MISSION_DAYS){s.ended={reason:'complete'}}
  else if(!preview){s.day++;startDay(s)}
  return out;
}
function flareDose_(c){return flareDose(c)}

/* ---------- scoring ---------- */
function summarize(s){
  const D=DIFFS[s.diff],n=s.crew.length;
  const goal=D.goal*n;
  const avgH=Math.round(s.crew.reduce((t,a)=>t+Math.max(0,a.health),0)/n);
  const maxDose=Math.max(...s.crew.map(a=>a.dose));
  const days=s.ended&&s.ended.reason==='complete'?MISSION_DAYS:s.day;
  const star1=s.ended&&s.ended.reason==='complete';
  const star2=star1&&s.sent>=goal;
  const star3=star2&&avgH>=70&&maxDose<=D.budget;
  const score=Math.round(s.sent*2+avgH+days*3+Math.max(0,D.budget-maxDose)*0.5);
  return{goal,avgH,maxDose:Math.round(maxDose),days,stars:(star1?1:0)+(star2?1:0)+(star3?1:0),score,budget:D.budget};
}

/* ---------- Mission Control advice ---------- */
function askEarth(s,ev){
  const site=SITES[s.site];s.stats.askedEarth++;
  s.power=Math.max(0,s.power-2);
  const best=ev.best(s);
  return{best,delayed:site.id==='mars'};
}

    const c=Math.min(14,m.live?panelCount(G):m.design.p);for(let i=0;i<c;i++){const p=panelXY(i);sh(p.x+16,p.y+19,15,4,len*.12)}
  }

function drawBerm(m){

function infoFor(k){
  const m=M(),g=m.live?G:null,mars=m.site==='mars';
  if(k.startsWith('crew')){
    const i=+k.slice(4),a=g&&g.crew[i];if(!a)return `${m.names[i]} is one of your astronauts. Pick a job for them!`;
    const job=picks&&picks[i]&&TASKS[picks[i]];
    return `<b>${esc(a.name)}</b> has ${Math.max(0,Math.round(a.health))}% health and has taken ${Math.round(a.dose)} mSv so far. ${job?`Today’s plan: ${job.name.toLowerCase()}.`:'No job picked yet.'}`;
  }
  switch(k){
    case 'panels':return g?`☀️ <b>Solar panels.</b> ${panelCount(g)} panels, ${Math.round(g.eff*100)}% clean, make <b>${solarToday(g).toFixed(0)}</b> power today${m.sun?'':'. That’s zero because the base is in shadow'}. Dust blocks sunlight, so brush the panels!${mars?' Sunlight on Mars is less than half as strong as on Earth.':''}`:'☀️ <b>Solar panels</b> turn sunlight into power. Dust and shadows make less.';
    case 'air':case 'air2':return g?`💨 <b>Life support.</b> Oxygen: ${Math.round(g.o2)} of 100. Your crew breathes about ${(3*g.crew.length*DIFFS[g.diff].use).toFixed(0)} a day, and the oxygen maker needs power to refill it.`:'💨 <b>Life support</b> makes air to breathe. It needs power.';
    case 'garden':return g?`🌱 <b>Garden.</b> Food: ${Math.round(g.food)} of 100. Each time you tend it you grow ${7+2*g.design.g}. Real astronauts have grown lettuce and chili peppers on the space station.`:'🌱 <b>Garden</b> grows fresh food for the crew.';
    case 'shield':return g?`🛡️ <b>Shielding.</b> Level ${g.shield} of 10 blocks about ${Math.round((1-shieldFactor(g))*100)}% of everyday radiation. Piling moon dirt (regolith) on walls is a real idea for protecting crews.`:'🛡️ <b>Shielding</b> is a wall of dirt that blocks radiation.';
    case 'power':return g?`🔋 <b>Batteries.</b> ${Math.round(g.power)} of ${g.powerMax} stored. The base uses ${loadToday(g).toFixed(0)} power a day for heaters and life support, even when you do nothing.`:'🔋 <b>Batteries</b> save power for shadows and night.';
    case 'nuke':return '☢️ <b>Nuclear battery.</b> It makes steady power from heat, day and night. Real rovers like Curiosity and Perseverance use one.';
    case 'dish':return g?`📡 <b>Radio dish.</b> Each “send” moves ${SITES[g.site].tx+6*g.design.d} data to Earth. Messages take ${SITES[g.site].delay}. Watch the data packets: they move slowly when Earth is far!`:'📡 <b>Radio dish</b> sends your science home to Earth.';
    case 'sun':return mars?'🌞 <b>The Sun.</b> From Mars it looks about two thirds as big as it does from Earth.':'🌞 <b>The Sun.</b> The Moon has no air, so the sky stays black even in daytime and you can see stars!';
    case 'earth':return mars?'🌍 <b>Earth.</b> A tiny dot. It’s 3 to 22 light-minutes away, depending on where the planets are.':'🌍 <b>Earth.</b> About 384,400 km away. A radio message needs about 1.3 seconds to get here.';
  }

}
function say(html){st.lastInfo=html;const el=document.getElementById(infoId);if(el)el.innerHTML=html}
function inspect(k){st.inspected=k==='air2'?'air':k;st.inspT=4;say(infoFor(k));const h=st.hs.find(q=>q.k===k);if(!h&&k==='sun')return}

/* ---- pointer ---- */
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function hit(p){
  for(let i=st.hs.length-1;i>=0;i--){const h=st.hs[i];
    if(h.t==='c'){if(Math.hypot(p.x-h.x,p.y-h.y)<=h.r)return h}
    else if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h)return h}
  return null}
cv.addEventListener('pointermove',e=>{const p=pt(e);st.mouse=p;const h=hit(p),k=h?h.k:null;if(k!==st.hover&&k&&typeof SND!=='undefined')SND.tick();st.hover=k});
cv.addEventListener('pointerleave',()=>{st.hover=null;st.mouse=null});
cv.addEventListener('click',e=>{
  const p=pt(e),h=hit(p);
  if(h){inspect(h.k);if(typeof FX!=='undefined')FX.burst(e.clientX,e.clientY,'amber',16)}
  else if(p.y>HZ+10){for(let i=0;i<14;i++)P({k:'dust',x:p.x,y:p.y,vx:(Math.random()-.5)*60,vy:-20-Math.random()*30,r:3+Math.random()*3,c:M().site==='mars'?'#d9a37a':'#cfcac3',life:1.2});say('👣 Dust! Moon and Mars dust is sticky and sharp, so it gets everywhere. Click parts of the base to learn what they do.')}
});

/* ---- loop ---- */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!cv.isConnected){last=ts;return}
  const dt=Math.min(.05,((ts-last)/1000)||.016);last=ts;
  update(dt);draw();
}
requestAnimationFrame(frame);

return{
  mount(slot){
    if(!slot)return;slot.innerHTML='';slot.appendChild(cv);
    say(st.lastInfo||'Click parts of your base to learn what they do.');

  inspect,say,
  preview(v){st.pv=v},focus(k){st.focus=k},
  pop(k,html){st.inspected=k;st.inspT=2.2;if(html)say(html)},
  burst(){if(!REDUCE)for(let i=0;i<10;i++)P({k:'ring',x:st.sx,y:st.sy,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,r:3,c:'#FFB627',life:1})}
};

}

function meter(label,icon,val,max,color,proj,focus){

}

/* ---------- EVENT MODAL ---------- */
function flareEvent(s){
  const f=s.today.flare,D=DIFFS[s.diff];
  return{icon:'☀️',title:`Space weather alert: ${f.cls} flare`,
    text:`The Sun just fired a flare. It’s replayed from a real one on ${f.date}. About ${Math.round(D.hit*10)} out of 10 storms like this send harmful particles toward us. Hide, or keep working?`,
    options:[
      {label:'Go to the storm shelter',desc:'Uses 5 power. No outside jobs today. Far less radiation.',fx:s=>{s.sheltered=true;s.stats.shelters++;return 'Everyone is inside the storm shelter, behind the thickest walls.'}},
      {label:'Keep working',desc:'All jobs allowed. If particles arrive, anyone outside gets a big dose.',fx:s=>'The crew keeps working and watches the sky.'}],
    best:()=>0,
    lesson:'Space weather forecasters at NASA and NOAA give warnings so astronauts can shelter. Sometimes the storm misses, but you can’t know until it’s too late.'};
}
function openModalIfNeeded(){
  if(!G||G.ended||modal||handled===G.day)return;
  if(G.today.flare){modal={ev:flareEvent(G),asked:false,advice:'',result:null,chosen:null};SND.alert()}
  else if(G.today.event){modal={ev:G.today.event,asked:false,advice:'',result:null,chosen:null};SND.alert()}
  else handled=G.day;
}
function modalHTML(){
  const m=modal,ev=m.ev,site=SITES[G.site];
  let body;
  if(!m.result){
    body=`<div class="big" aria-hidden="true">${ev.icon}</div><h2 id="mt">${esc(ev.title)}</h2><p>${esc(ev.text)}</p>
    ${ev.options.map((o,i)=>`<button class="opt" data-a="opt" data-i="${i}"><b>${esc(o.label)}</b><br><small>${esc(o.desc)}</small></button>`).join('')}
    ${m.advice?`<div class="advice">${m.advice}</div>`:`<button class="btn ghost" style="margin-top:12px" data-a="ask">📡 Ask Mission Control (uses 2 power)</button>`}`;
  }else{
    body=`<div class="big" aria-hidden="true">${ev.icon}</div><h2 id="mt">${esc(ev.title)}</h2><p><b>${esc(m.result)}</b></p>
    <div class="lesson">💡 ${esc(ev.lesson)}</div>
    <div class="row" style="margin-top:14px"><button class="btn big" data-a="cont">Continue</button></div>`;
  }
  return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">${body}</div></div>`;
}
function doAsk(){
  const m=modal,ev=m.ev,site=SITES[G.site];
  const r=askEarth(G,ev),opt=ev.options[r.best];
  m.asked=true;
  if(r.delayed)m.advice=`📡 Message sent! Earth is <b>${esc(site.delay)}</b> away, so the answer won’t arrive in time. Your crew has to decide on its own.`;
  else m.advice=`📡 Mission Control answers in a couple of seconds: <b>“I’d pick: ${esc(opt.label)}.”</b>`;
}
function doOpt(i){
  const m=modal,ev=m.ev;m.chosen=i;
  m.result=ev.options[i].fx(G);
  if(!ev.id)G.stats.flareChoice=i;else G.stats.events++;
  if(m.asked&&SITES[G.site].id==='mars'){
    const best=ev.best(G),same=best===i;
    G.replies.push({day:G.day+1,text:`Earth’s answer finally arrived: “I’d pick: ${ev.options[best].label}.” ${same?'That’s what you chose. Nice!':'You chose differently, on your own.'}`});
  }
}

/* ---------- REPORT ---------- */
function chartSVG(h){
  if(!h.length)return '';
  const W=640,H=220,pad=30,max=120;
  const x=i=>pad+(i/(Math.max(1,MISSION_DAYS-1)))*(W-pad*2),y=v=>H-pad-(Math.max(0,Math.min(max,v))/max)*(H-pad*2);
  const line=(key,col)=>`<polyline fill="none" stroke="var(${col})" stroke-width="3" stroke-linejoin="round" points="${h.map((r,i)=>x(i)+','+y(r[key]).toFixed(1)).join(' ')}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of power, oxygen, food and health over the mission">
   <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)" stroke-width="2"/>
   <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="var(--line)" stroke-width="2"/>
   ${line('power','--power')}${line('o2','--o2')}${line('food','--food')}${line('health','--rad')}
   <text x="${pad}" y="${H-8}" font-size="12" fill="var(--muted)">Day 1</text><text x="${W-pad-34}" y="${H-8}" font-size="12" fill="var(--muted)">Day ${MISSION_DAYS}</text></svg>
   <div class="row small"><span style="color:var(--power)">■ Power</span><span style="color:var(--o2)">■ Oxygen</span><span style="color:var(--food)">■ Food</span><span style="color:var(--rad)">■ Crew health</span></div>`;
}
function analysis(s,sum){
  const out=[],st=s.stats,goal=sum.goal;
  if(s.ended.reason==='early')out.push(`<b>Why the mission ended early:</b> ${esc(s.ended.who)} needed to come home. ${st.o2Short?'Oxygen ran out at least once. ':''}${st.foodShort?'Food ran out at least once. ':''}${st.brownouts?'The base lost power '+st.brownouts+' time(s), so the heaters stopped. ':''}${sum.maxDose>sum.budget?'The radiation budget was passed. ':''}`);
  if(s.sent>=goal)out.push(`<b>Science:</b> you sent ${s.sent} data home. The goal was ${goal}. Great teamwork!`);
  else out.push(`<b>Science:</b> you sent ${s.sent} of ${goal} data. ${s.data>0?`${s.data} more data was still stuck on the base computer. It only counts once it reaches Earth!`:'Try a few more experiments and “Send data home” jobs.'}`);
  if(st.storageFull)out.push(`<b>Storage:</b> the computer filled up ${st.storageFull} time(s) and lost data. Sending data home more often would help.`);
  out.push(`<b>Radiation:</b> your most exposed astronaut took ${sum.maxDose} of ${sum.budget} mSv (game scale). ${st.shelters?`You sheltered ${st.shelters} time(s), which blocked about ${Math.round(st.flareDoseDodged)} mSv of flare radiation across the crew.`:'You never used the storm shelter.'}${st.flareDoseTaken>0?` Flares delivered ${Math.round(st.flareDoseTaken)} mSv to the crew.`:''}`);
  out.push(`<b>Power:</b> ${st.brownouts?`there ${st.brownouts===1?'was 1 brownout':'were '+st.brownouts+' brownouts'}. Every job that needs power competes with the heaters and life support.`:'no brownouts. Your power budget held up.'} ${st.fizzles?`${st.fizzles} job(s) failed because power or air ran short.`:''}`);
  out.push(`<b>Talking to Earth:</b> you asked Mission Control ${st.askedEarth} time(s). ${s.site==='mars'?'On Mars the answer takes minutes, so astronauts must be able to decide alone.':'On the Moon the answer is almost instant, so help is easy to get.'}`);
  const low=[['power',s.power/s.powerMax],['oxygen',s.o2/100],['food',s.food/100]].sort((a,b)=>a[1]-b[1])[0][0];
  out.push(`<b>Try next time:</b> your tightest resource was <b>${low}</b>. Change one thing in the design, play again with the same code, and see what moves.`);
  return out;
}
function viewReport(){
  const s=G,sum=summarize(s),site=SITES[s.site],done=s.ended.reason==='complete';
  if(!saved){saved=true;lb=loadLB();lb.push({team:s.crew.map(a=>a.name).join(' & '),site:site.name,stars:sum.stars,score:sum.score});saveLB(lb.sort((a,b)=>b.score-a.score).slice(0,20))}
  const code=makeCode();
  if(!S._played){S._played=1;sum.stars>0?SND.win():SND.sad()}
  app.innerHTML=`
  <div class="card" style="padding:10px">${sceneBlock()}</div>
  <div class="card" style="text-align:center;margin-top:12px">

    <h1 style="font-size:2.2rem">${done?'Mission complete!':'Emergency return'}</h1>
    <p>${done?`Your crew lived on ${site.name} for 30 ${site.unit}s.`:`The crew came home after ${sum.days} ${site.unit}s.`} Score: <b>${sum.score}</b></p>
    <p class="small">⭐ Survive all 30 ${site.unit}s · ⭐ Send ${sum.goal} data home · ⭐ Crew healthy and under ${sum.budget} mSv</p>
  </div>

    <div class="stat">Data sent<b>${s.sent}</b></div><div class="stat">Crew health<b>${sum.avgH}%</b></div>
    <div class="stat">Top radiation dose<b>${sum.maxDose} mSv</b></div><div class="stat">Moonwalks<b>${s.stats.evas}</b></div>
  </div>
  <section class="card" style="margin-top:12px"><h2>Your mission, day by day</h2>${chartSVG(s.history)}</section>
  <section class="card" style="margin-top:12px"><h2>Why it went this way</h2><ul class="why">${analysis(s,sum).map(l=>`<li>${l}</li>`).join('')}</ul></section>
  <section class="card" style="margin-top:12px"><h2>Real-world check</h2>
    <p>Flares in this game came from the <b>${S.source==='live'?'live NASA DONKI service':S.source==='shared'?'shared mission code (NASA flare records)':'archived NASA flare record'}</b>: ${s.flares.map(f=>esc(f.cls)+' on '+esc(f.date)).join(', ')}.</p>
    <p class="small">Game scale: radiation per day is about 1.4 mSv on the Moon and 0.67 mSv on Mars. These are real surface measurements from lunar and Mars missions. Flare doses, power, and food numbers are simplified for play. NASA’s real career limit is 600 mSv, but we use a smaller budget so you can feel it in 30 days.</p>
    <p class="small">Learn more: <a href="https://api.nasa.gov" target="_blank" rel="noopener">NASA Open APIs (DONKI)</a> · <a href="https://osdr.nasa.gov" target="_blank" rel="noopener">NASA Open Science Data Repository</a></p>
  </section>
  <section class="card" style="margin-top:12px"><h3>Share this base</h3>
    <p class="small">Send this code to a friend. They get the same base and the same surprises. Who scores higher?</p>
    <div class="codebox"><input readonly id="codeout" value="${esc(code)}" aria-label="Mission code" onfocus="this.select()"><button class="btn ghost" data-a="copy">Copy</button></div>
  </section>
  <div class="row" style="margin-top:16px"><button class="btn big" data-a="again">Fly again with the same code</button><button class="btn ghost" data-a="home">New mission</button></div>
  ${leaderboardHTML()}`;

/* ---------- render + events ---------- */
function render(){
  TIP.hide();SCENE.preview(null);SCENE.focus(null);
  if(S.view==='setup')viewSetup();
  else if(S.view==='design')viewDesign();
  else if(S.view==='game'){openModalIfNeeded();viewGame()}
  else if(S.view==='report')viewReport();
  window.scrollTo(0,0);
}
function rerenderKeepScroll(){TIP.hide();SCENE.preview(null);const y=window.scrollY;if(S.view==='game'){openModalIfNeeded();viewGame()}else render();window.scrollTo(0,y)}

function doPick(i,k){
  picks[i]=k;SND.pick(TASK_ORDER.indexOf(k));
  const nx=picks.findIndex(p=>!p);S.act=nx>=0?nx:i;
  rerenderKeepScroll();
}
function startGame(){
  S._played=0;S.act=0;
  const names=[];for(let i=0;i<S.players;i++)names.push((S.names[i]||'').trim()||['Nova','Orion','Luna','Comet'][i]);
  G=newGame({site:S.site,diff:S.diff,names,design:S.design,seed:S.seed,flares:S.flares});
  picks=G.crew.map(()=>null);handled=0;modal=null;saved=false;S.view='game';
render();
}

app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'players':S.players=+v;render();break;
    case 'site':S.site=v;S.design=defaultDesign();render();break;
    case 'diff':S.diff=v;render();break;
    case 'toDesign':S.view='design';S.seed=Math.floor(Math.random()*1e9);S.flares=null;render();break;
    case 'back':S.view='setup';render();break;
    case 'part':{const k=b.dataset.k;S.design[k]=Math.max(0,S.design[k]+(+v));rerenderKeepScroll();const P_=PARTS.find(p=>p.k===k);SCENE.pop(PART_FOCUS[k],`${P_.icon} <b>${P_.name}: ${S.design[k]}</b>. ${P_.why}`);break}
    case 'launch':{
      if(!S.flares){S.loading=true;viewDesign();const r=await loadFlares();S.flares=r.flares;S.source=r.source;S.loading=false}
      startGame();break}
    case 'loadCode':{
      const val=document.getElementById('codein').value;S.code=val;
      try{readCode(val);S.codeMsg='Code loaded! Your base and surprises are set.';S.view='design';render()}
      catch(err){S.codeMsg='That code didn’t work. Check that you copied all of it.';render()}
      break}
    case 'act':S.act=+b.dataset.i;rerenderKeepScroll();break;
    case 'pick':doPick(+b.dataset.i,b.dataset.k);break;
    case 'startDay':{SND.start();SCENE.burst();playDay(G,picks);picks=G.crew.map(()=>null);if(G.ended){S.view='report';render()}else rerenderKeepScroll();break}
    case 'quit':if(confirm('Leave this mission?')){S.view='setup';render()}break;
    case 'ask':doAsk();rerenderKeepScroll();break;
    case 'opt':doOpt(+b.dataset.i);rerenderKeepScroll();break;
    case 'cont':handled=G.day;modal=null;rerenderKeepScroll();break;
    case 'copy':{const el=document.getElementById('codeout');el.select();try{await navigator.clipboard.writeText(el.value);b.textContent='Copied!'}catch(err){b.textContent='Press Ctrl+C'}break}
    case 'inspect':SCENE.inspect(v);break;
    case 'again':startGame();break;
    case 'home':S.view='setup';render();break;
  }
});
app.addEventListener('input',e=>{
  if(e.target.dataset.name!==undefined)S.names[+e.target.dataset.name]=e.target.value;
  if(e.target.id==='codein')S.code=e.target.value;
});

/* ---------- interaction layer: sparks, sound, tooltips, hover previews, keyboard ---------- */
const REDUCE_UI=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const FX=(function(){
  const c=document.createElement('canvas');c.setAttribute('aria-hidden','true');
  c.style.cssText='position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:60';
  document.body.appendChild(c);const x=c.getContext&&c.getContext('2d');
  const DPR=Math.min(2,window.devicePixelRatio||1);let P=[],run=false,t=0,seed=1,last=0;
  function size(){c.width=innerWidth*DPR;c.height=innerHeight*DPR;if(x)x.setTransform(DPR,0,0,DPR,0,0)}
  size();addEventListener('resize',size);
  const pal={amber:['#FFB627','#FFD27A','#fff3c4'],teal:['#2EC4B6','#8ff0e6','#ffffff'],pink:['#FF5C93','#FF9CBC','#ffffff'],blue:['#6CB8FF','#b6dcff','#ffffff'],green:['#7BC950','#b8ec9a','#ffffff']};
  function loop(ts){
    const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;t+=dt;
    x.clearRect(0,0,innerWidth,innerHeight);
    for(const p of P){
      const a=Math.sin(p.x*.02+t*3)+Math.cos(p.y*.024-t*2);
      p.vx+=Math.cos(a*1.7)*140*dt;p.vy+=Math.sin(a*1.7)*140*dt-30*dt;p.vx*=.955;p.vy*=.955;
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
      x.globalAlpha=Math.max(0,p.life/p.max);x.fillStyle=p.c;
      if(p.sh){x.save();x.translate(p.x,p.y);x.rotate(t*6+p.r);x.fillRect(-p.r,-p.r,p.r*2,p.r*2);x.restore()}
      else{x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
    }
    x.globalAlpha=1;P=P.filter(p=>p.life>0);
    if(P.length)requestAnimationFrame(loop);else{run=false;x.clearRect(0,0,innerWidth,innerHeight)}
  }
  return{burst(px,py,col,n){
    if(REDUCE_UI||!x)return;
    const R=mulberry32((seed++)*977),cols=pal[col]||pal.amber;
    for(let i=0;i<(n||14);i++){const a=R()*6.283,s=60+R()*150,l=.45+R()*.55;P.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:l,max:l,r:1.6+R()*2.4,c:cols[i%3],sh:R()<.4})}
    if(P.length>400)P.splice(0,P.length-400);
    if(!run){run=true;last=performance.now();requestAnimationFrame(loop)}
  }};
})();

const SND=(function(){
  let ac=null,on=false;try{on=localStorage.getItem('mmc_snd')==='1'}catch(e){}
  function A(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{ac=new C()}catch(e){return null}}if(ac.state==='suspended')ac.resume();return ac}
  function tone(f,d,type,v,f2,delay){
    if(!on)return;const a=A();if(!a)return;
    const t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v||.05,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.03);
  }
  return{
    get on(){return on},
    set(v){on=v;try{localStorage.setItem('mmc_snd',v?'1':'0')}catch(e){}},
    tick(){tone(1100,.025,'sine',.012)},
    click(){tone(480,.09,'triangle',.05,720)},
    pick(i){tone(330+i*45,.13,'triangle',.06,440+i*45)},
    start(){tone(180,.5,'sawtooth',.035,900)},
    alert(){tone(660,.14,'square',.025);tone(440,.2,'square',.025,null,.15)},
    win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.06,null,i*.12))},
    sad(){tone(300,.45,'sine',.05,150)}
  };
})();

const TIP=(function(){
  const el=document.createElement('div');el.id='tip';el.setAttribute('role','tooltip');document.body.appendChild(el);let cur=null;
  function hide(){cur=null;el.classList.remove('on')}
  function show(t){
    const txt=t.getAttribute('data-tip');if(!txt){hide();return}
    cur=t;el.textContent=txt;el.classList.add('on');
    const r=t.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;
    let left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2)),top=r.top-h-10;if(top<8)top=r.bottom+10;
    el.style.left=left+'px';el.style.top=top+'px';
  }
  return{hide,show,get cur(){return cur}};
})();

(function(){
  /* sound button */
  const b=document.createElement('button');b.className='sndbtn';b.id='snd';
  const paint=()=>{b.textContent=SND.on?'🔊':'🔇';b.setAttribute('aria-pressed',SND.on);b.setAttribute('aria-label',SND.on?'Sound effects on':'Sound effects off');b.setAttribute('data-tip',SND.on?'Sound is on. Click to mute':'Turn on sound effects')};
  paint();document.body.appendChild(b);
  b.addEventListener('click',()=>{SND.set(!SND.on);paint();SND.click();TIP.hide()});
  /* delegate on document so the button gets tips and sparks too */
  const colFor=el=>el.closest('.task')?'amber':el.closest('.chip')?'teal':el.closest('.opt')?'pink':el.closest('.site')?'blue':el.closest('.step')?'green':'amber';
  let lastEl=null;
  document.addEventListener('pointerdown',e=>{
    const t=e.target.closest('button,.scenecv');if(!t||t.disabled)return;
    const col=t.classList&&t.classList.contains('scenecv')?'amber':colFor(t);
    FX.burst(e.clientX,e.clientY,col,t.classList.contains('task')?22:12);
    if(!t.classList.contains('scenecv'))SND.click();
    try{if(!REDUCE_UI&&navigator.vibrate)navigator.vibrate(8)}catch(err){}
  });
  document.addEventListener('mouseover',e=>{
    const t=e.target.closest('button,.opt,.site');
    if(t&&t!==lastEl&&!t.disabled){SND.tick();if(!t.classList.contains('scenecv'))FX.burst(e.clientX,e.clientY,colFor(t),3)}
    lastEl=t||null;
    const tp=e.target.closest('[data-tip]');if(tp!==TIP.cur){tp?TIP.show(tp):TIP.hide()}
    const tk=e.target.closest('.task[data-a=pick]');
    SCENE.preview(tk&&!tk.disabled?{i:+tk.dataset.i,k:tk.dataset.k}:null);
    const f=e.target.closest('[data-focus]');SCENE.focus(f&&f.dataset.focus?f.dataset.focus:null);
  });
  document.addEventListener('mouseleave',()=>{TIP.hide();SCENE.preview(null);SCENE.focus(null)});
  document.addEventListener('focusin',e=>{
    const tp=e.target.closest('[data-tip]');tp?TIP.show(tp):TIP.hide();
    const tk=e.target.closest('.task[data-a=pick]');SCENE.preview(tk&&!tk.disabled?{i:+tk.dataset.i,k:tk.dataset.k}:null);
    const f=e.target.closest('[data-focus]');SCENE.focus(f&&f.dataset.focus?f.dataset.focus:null);
  });
  document.addEventListener('focusout',()=>{TIP.hide();SCENE.preview(null);SCENE.focus(null)});
  addEventListener('scroll',()=>TIP.hide(),{passive:true});
  /* hover glow + card tilt follow the pointer */
  document.addEventListener('mousemove',e=>{
    const t=e.target.closest('.btn,.task,.chip,.opt,.site,.sndbtn');if(!t)return;
    const r=t.getBoundingClientRect();
    t.style.setProperty('--mx',(e.clientX-r.left)+'px');t.style.setProperty('--my',(e.clientY-r.top)+'px');
    if(t.classList.contains('site')&&!REDUCE_UI){t.style.setProperty('--tx',(((e.clientX-r.left)/r.width-.5)*8).toFixed(1)+'deg');t.style.setProperty('--ty',(-((e.clientY-r.top)/r.height-.5)*8).toFixed(1)+'deg')}
  });
  /* keyboard shortcuts */
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    const tg=(e.target&&e.target.closest)?e.target:document.body;
    const tag=(tg.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;
    const onBtn=!!tg.closest('button');
    if(S.view!=='game'||!G||G.ended)return;
    if(modal){
      if(!modal.result){
        if(/^[1-9]$/.test(e.key)&&modal.ev.options[+e.key-1]){doOpt(+e.key-1);SND.click();rerenderKeepScroll();e.preventDefault()}
        else if((e.key==='a'||e.key==='A')&&!modal.asked){doAsk();rerenderKeepScroll()}
      }else if(e.key==='Enter'&&!onBtn){handled=G.day;modal=null;rerenderKeepScroll()}
      return;
    }
    if(/^[1-8]$/.test(e.key)){const k=TASK_ORDER[+e.key-1];if(taskAvailable(G,k)){doPick(S.act||0,k);e.preventDefault()}}
    else if(e.key==='ArrowRight'||e.key==='ArrowDown'){if(!onBtn||tg.closest('.astro')){S.act=((S.act||0)+1)%G.crew.length;rerenderKeepScroll()}}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(!onBtn||tg.closest('.astro')){S.act=((S.act||0)-1+G.crew.length)%G.crew.length;rerenderKeepScroll()}}
    else if(e.key==='Enter'&&!onBtn&&picks.every(Boolean)){SND.start();SCENE.burst();playDay(G,picks);picks=G.crew.map(()=>null);S.act=0;if(G.ended){S.view='report';render()}else rerenderKeepScroll()}
  });
})();

render();

</script>
</body>
</html>
